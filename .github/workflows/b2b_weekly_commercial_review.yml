name: SRD B2B Weekly Commercial Review (Mon 09:00 IST)

# Timezone Conversion: Monday 09:00 IST (Asia/Kolkata, UTC+05:30) = Monday 03:30 UTC (cron: 30 3 * * 1)
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: srd-b2b-weekly-commercial-review
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONPATH: .
  CRM_SPREADSHEET_ID: ${{ secrets.CRM_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

jobs:
  weekly-commercial-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt
      - name: Run Weekly Commercial Review Engine
        run: python -m src.runner --workflow weekly_review
      - name: Failure Alert Summary
        if: failure()
        run: echo "::error::b2b_weekly_commercial_review failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) (IST: $(date '+%Y-%m-%d %H:%M:%S %Z'))"
