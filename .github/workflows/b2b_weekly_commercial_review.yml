name: SRD B2B Weekly Commercial Review (Mon 09:00 IST)

# Timezone Conversion: Monday 09:00 IST (Asia/Kolkata, UTC+05:30) = Monday 03:30 UTC (cron: 30 3 * * 1)
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: srd-b2b-weekly-review
  cancel-in-progress: false

jobs:
  weekly-commercial-review:
    runs-on: ubuntu-latest
    steps:
      - name: Run Weekly Commercial Review Check
        shell: bash
        run: |
          RUN_IST=$(TZ=Asia/Kolkata date "+%Y-%m-%d %H:%M:%S %Z (%z)")
          echo "Weekly commercial review started at ${RUN_IST}"
