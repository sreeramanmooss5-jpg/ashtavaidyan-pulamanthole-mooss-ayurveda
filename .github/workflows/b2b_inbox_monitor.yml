name: SRD B2B Inbox Monitor (09:00-19:00 IST Every 2h)

# Timezone Conversion (Asia/Kolkata, UTC+05:30):
# 09:00 IST = 03:30 UTC | 11:00 IST = 05:30 UTC | 13:00 IST = 07:30 UTC
# 15:00 IST = 09:30 UTC | 17:00 IST = 11:30 UTC | 19:00 IST = 13:30 UTC
on:
  schedule:
    - cron: "30 3,5,7,9,11,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: srd-b2b-inbox-monitor
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  GMAIL_SENDER_EMAIL: srdayurveda@gmail.com
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

jobs:
  inbox-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Gmail OAuth Secret Readiness
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_IST=$(date "+%Y-%m-%d %H:%M:%S %Z (%z)")
          echo "Inbox monitor check at ${ACTUAL_IST} for srdayurveda@gmail.com"
          if [ -z "${GMAIL_CLIENT_ID}" ] || [ -z "${GMAIL_CLIENT_SECRET}" ] || [ -z "${GMAIL_REFRESH_TOKEN}" ]; then
            echo "::error::Missing Gmail OAuth secrets (GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN). Configure them in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Gmail OAuth secret references present."

      - name: Failure Alert Summary
        if: failure()
        shell: bash
        run: |
          echo "::error::Workflow b2b_inbox_monitor failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) (Actual IST: $(date '+%Y-%m-%d %H:%M:%S %Z'))."
