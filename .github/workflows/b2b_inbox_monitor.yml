name: SRD B2B Inbox Monitor (09:00-19:00 IST Every 2h)

# Timezone Conversion (Asia/Kolkata, UTC+05:30):
# 09:00 IST = 03:30 UTC | 11:00 IST = 05:30 UTC | 13:00 IST = 07:30 UTC
# 15:00 IST = 09:30 UTC | 17:00 IST = 11:30 UTC | 19:00 IST = 13:30 UTC
on:
  schedule:
    - cron: "30 3,5,7,9,11,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: srd-b2b-inbox-monitor
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONPATH: .
  CRM_SPREADSHEET_ID: ${{ secrets.CRM_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GMAIL_SENDER_EMAIL: srdayurveda@gmail.com
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

jobs:
  inbox-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt
      - name: Run Inbox Monitor Engine (Read-Only, Zero Outbound Send)
        run: python -m src.runner --workflow inbox_monitor
      - name: Failure Alert Summary
        if: failure()
        run: echo "::error::b2b_inbox_monitor failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) (IST: $(date '+%Y-%m-%d %H:%M:%S %Z'))"
