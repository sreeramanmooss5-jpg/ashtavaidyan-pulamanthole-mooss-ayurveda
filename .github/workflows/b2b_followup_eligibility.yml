name: SRD B2B Follow-Up Eligibility Check (10:00 IST)

# Timezone Conversion: 10:00 IST (Asia/Kolkata, UTC+05:30) = 04:30 UTC (cron: 30 4 * * *)
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: srd-b2b-followup-eligibility
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONPATH: .
  CRM_SPREADSHEET_ID: ${{ secrets.CRM_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

jobs:
  followup-eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt
      - name: Run Follow-Up Eligibility Engine
        run: python -m src.runner --workflow followup_eligibility
      - name: Failure Alert Summary
        if: failure()
        run: echo "::error::b2b_followup_eligibility failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) (IST: $(date '+%Y-%m-%d %H:%M:%S %Z'))"
