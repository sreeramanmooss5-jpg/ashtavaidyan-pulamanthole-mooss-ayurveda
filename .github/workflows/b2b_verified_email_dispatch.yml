name: SRD B2B Verified Email Dispatch (10:15 IST)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "45 4 * * *"

permissions:
  contents: read

concurrency:
  group: srd-b2b-verified-email-dispatch
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONPATH: .
  CRM_SPREADSHEET_ID: ${{ secrets.CRM_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
  GMAIL_SENDER_EMAIL: srdayurveda@gmail.com
  B2B_ALLOW_VERIFIED_SEND: ${{ secrets.B2B_ALLOW_VERIFIED_SEND }}
  B2B_DAILY_SEND_LIMIT: "10"

jobs:
  verified-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt
      - name: Run Unit Tests
        run: pytest -v
      - name: Dispatch to verified and eligible B2B buyers
        run: python -m scripts.b2b_verified_outreach_dispatch
