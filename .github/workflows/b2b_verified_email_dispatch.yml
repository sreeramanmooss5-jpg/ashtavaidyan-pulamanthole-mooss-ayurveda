name: SRD B2B Verified Outreach (Scheduled / Dry-Run on Changes)

on:
  workflow_dispatch:
    inputs:
      live_send:
        description: "Send eligible verified B2B emails now (requires B2B_ALLOW_VERIFIED_SEND=true)"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/b2b_verified_email_dispatch.yml"
      - "scripts/b2b_verified_outreach_dispatch.py"
      - "src/inbox_monitor/engine.py"
      - "tests/**"
  schedule:
    # 09:00 Asia/Kolkata, Monday-Friday (GitHub cron is UTC)
    - cron: "30 3 * * 1-5"

permissions:
  contents: read

concurrency:
  group: srd-b2b-verified-outreach
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONPATH: .
  CRM_SPREADSHEET_ID: ${{ secrets.CRM_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
  GMAIL_SEND_REFRESH_TOKEN: ${{ secrets.GMAIL_SEND_REFRESH_TOKEN }}
  GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL || 'pulamantholemooss@gmail.com' }}
  B2B_ALLOW_VERIFIED_SEND: ${{ secrets.B2B_ALLOW_VERIFIED_SEND }}
  B2B_DAILY_SEND_LIMIT: "10"

jobs:
  verified-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Build read-only dispatch preview
        run: python -m scripts.b2b_verified_outreach_dispatch
      - name: Send eligible verified B2B emails
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_send == true)) && env.B2B_ALLOW_VERIFIED_SEND == 'true'
        run: python -m scripts.b2b_verified_outreach_dispatch --live-send
      - name: Fail closed if live sending was requested but disabled
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_send == true)) && env.B2B_ALLOW_VERIFIED_SEND != 'true'
        run: |
          echo "::error::Live sending requested but B2B_ALLOW_VERIFIED_SEND is not true."
          exit 1
