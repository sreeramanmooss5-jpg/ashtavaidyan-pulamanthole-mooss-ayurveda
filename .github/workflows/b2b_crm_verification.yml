name: SRD B2B CRM Verification & Sync (07:00 IST)

# Timezone Conversion: 07:00 IST (Asia/Kolkata, UTC+05:30) = 01:30 UTC (cron: 30 1 * * *)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 1 * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/b2b_crm_verification.yml"

permissions:
  contents: read

concurrency:
  group: srd-b2b-crm-verification
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONPATH: .
  CRM_SPREADSHEET_ID: ${{ secrets.CRM_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

jobs:
  crm-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt
      - name: Run Unit Tests
        run: pytest -v
      - name: Run CRM Verification Engine
        run: python -m src.runner --workflow crm_verification
      - name: Failure Alert Summary
        if: failure()
        run: echo "::error::b2b_crm_verification failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) (IST: $(date '+%Y-%m-%d %H:%M:%S %Z'))"
