name: SRD B2B CRM Verification & Sync (07:00 IST)

# Timezone Conversion: 07:00 IST (Asia/Kolkata, UTC+05:30) = 01:30 UTC (cron: 30 1 * * *)
# Note: GitHub Actions schedules may start late or experience queue delays; actual timestamps are logged.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: srd-b2b-crm-verification
  cancel-in-progress: false

jobs:
  crm-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Verification Run
        shell: bash
        run: |
          RUN_IST=$(TZ=Asia/Kolkata date +%Y-%m-%dT%H:%M:%S%z)
          echo "Verification job started at ${RUN_IST} (Asia/Kolkata)"
          echo "Enforcing dedup keys: normalized company name, website domain, official email, phone."
