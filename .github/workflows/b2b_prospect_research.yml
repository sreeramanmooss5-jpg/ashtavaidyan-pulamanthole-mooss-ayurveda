name: SRD B2B Prospect Research (06:00 IST)

# Timezone Conversion: 06:00 IST (Asia/Kolkata, UTC+05:30) = 00:30 UTC (cron: 30 0 * * *)
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths: ["src/**", "tests/**", ".github/workflows/**"]
  schedule:
    - cron: "30 0 * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/b2b_prospect_research.yml"

permissions:
  contents: read

concurrency:
  group: srd-b2b-prospect-research
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONPATH: .
  CRM_SPREADSHEET_ID: ${{ secrets.CRM_SPREADSHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GMAIL_SENDER_EMAIL: srdayurveda@gmail.com

jobs:
  prospect-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt
      - name: Run Unit Tests
        run: pytest -v
      - name: Run Prospect Research Engine
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m src.runner --workflow prospect_research
      - name: Failure Alert Summary
        if: failure()
        run: echo "::error::b2b_prospect_research failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) (IST: $(date '+%Y-%m-%d %H:%M:%S %Z'))"
